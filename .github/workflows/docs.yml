name: Build and Deploy Documentation

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      pr_number:
          description: 'PR number to release'
          required: true
          type: number

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"
        enable-cache: true

    - name: Install Python dependencies
      run: |
        uv sync --group dev
        uv pip install -e .

    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: release

    - name: Configure Quarto Python environment
      run: |
        echo "QUARTO_PYTHON=$(uv run which python)" >> $GITHUB_ENV

    - name: Generate API Documentation
      run: |
        uv run python scripts/update_docs.py

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v4

    - name: Set site path for dev branch
      if: github.ref == 'refs/heads/dev'
      run: |
        cd docs
        # Add site-path to _quarto.yml for dev deployment
        echo "" >> _quarto.yml
        echo "website:" >> _quarto.yml
        echo "  site-path: \"/dev\"" >> _quarto.yml

    - name: Render Quarto Documentation
      run: |
        cd docs
        uv run quarto render

    - name: Checkout gh-pages branch (for dev deployment)
      if: github.ref == 'refs/heads/dev'
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages-content

    - name: Prepare dev deployment
      if: github.ref == 'refs/heads/dev'
      run: |
        # Remove old dev directory if exists
        rm -rf gh-pages-content/dev
        # Copy new dev build to gh-pages
        mkdir -p gh-pages-content/dev
        cp -r docs/_site/* gh-pages-content/dev/
        # Ensure .nojekyll exists
        touch gh-pages-content/.nojekyll

    - name: Upload artifact (main branch)
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: docs/_site

    - name: Upload artifact (dev branch)
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/dev'
      with:
        path: gh-pages-content

    - name: Upload build results (for PR testing)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request'
      with:
        name: documentation-build
        path: docs/_site
        retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
