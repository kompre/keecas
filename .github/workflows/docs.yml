name: Build and Deploy Documentation

on:
  push:
    branches: [main]  # Only deploy from main branch
    paths:
      - 'docs/**'
      - 'src/keecas/**/*.py'          # Only source files (API docs)
      - 'scripts/update_docs.py'      # Doc generation script
      - '.github/workflows/docs.yml'  # This workflow
      - '*.md'                        # Root markdown files
      - 'README.md'
      - 'CHANGELOG.md'
      - 'examples/**'                 # Example notebooks linked in docs
  workflow_run:
    workflows: ["Release"]
    types: [completed]                # Auto-rebuild after releases
  workflow_dispatch:                  # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"  # Only one deployment group needed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@v1
      with:
        version: "latest"
        enable-cache: true

    - name: Install Python dependencies
      run: |
        uv sync --group dev

    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      with:
        version: release

    - name: Configure Quarto Python environment
      run: |
        echo "QUARTO_PYTHON=$(uv run which python)" >> $GITHUB_ENV

    - name: Extract version from pyproject.toml
      id: version
      run: |
        VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version: $VERSION"

    - name: Generate API Documentation
      run: |
        uv run python scripts/update_docs.py

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v4

    - name: Render Quarto Documentation
      run: |
        cd docs
        uv run quarto render --profile main -M version:"${{ steps.version.outputs.version }}" -M pypi_url_full:"https://pypi.org/project/keecas/${{ steps.version.outputs.version }}/"

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      if: github.event_name != 'pull_request'
      with:
        path: docs/_site

    - name: Upload build results (for PR testing)
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request'
      with:
        name: documentation-build
        path: docs/_site
        retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
