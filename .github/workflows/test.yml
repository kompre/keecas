name: Run Tests

on:
  pull_request:
    branches: [ main, dev ]
  # No branch filter (main/dev included, same as before): GitHub Actions does
  # not reliably fire pull_request/opened for PRs created by this session's own
  # GitHub identity (observed on #114 and #115 - the PR's initial head commit
  # never got a "Run Tests" run, only a later push to the already-open PR, via
  # pull_request/synchronize, did). Running on every push means the check for
  # a PR's head commit already exists by the time the PR opens, regardless of
  # whether the opened event itself fires, closing that gap without relying on
  # anyone remembering to manually re-run the workflow.
  push:
    branches-ignore:
      - 'release-please--branches--**'  # already covered by its own pull_request run; avoid a redundant duplicate
  # lint-fix.yml commits and pushes using secrets.GITHUB_TOKEN, and pushes made
  # with the default GITHUB_TOKEN never trigger other workflows' push/pull_request
  # triggers (GitHub's own recursion-prevention rule - undocumented by us, but
  # confirmed here: lint-fix's auto-commits got zero "Run Tests" runs via push
  # even after the fix above). workflow_run isn't subject to that restriction,
  # so this catches the case where lint-fix's auto-fix commit ends up being a
  # PR's actual final head.
  workflow_run:
    workflows: ["Auto-fix Linting Issues"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Skip if this was triggered by lint-fix.yml failing (nothing new to verify).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run always checks out the default branch unless told otherwise -
          # pin it to the commit that triggered lint-fix.yml in that case.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0  # Need full history to detect changed files

      - name: Detect changed files
        id: changes
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            # Push event - base_ref is not set, always run full tests
            echo "🔍 Push event - running full tests"
            echo "docs_only=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get list of changed files in this PR
          git fetch origin "$BASE_REF"
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Define documentation-only paths (regex patterns)
          DOCS_ONLY_PATTERNS="^docs/|^examples/|^\.github/workflows/docs\.yml$|\.md$|^_docs/"

          # Check if all changes are documentation-only
          DOCS_ONLY=true
          while IFS= read -r file; do
            if [[ ! "$file" =~ $DOCS_ONLY_PATTERNS ]]; then
              echo "Non-docs file found: $file"
              DOCS_ONLY=false
              break
            fi
          done <<< "$CHANGED_FILES"

          if [ "$DOCS_ONLY" = true ]; then
            echo "✅ Documentation-only changes detected"
            echo "docs_only=true" >> $GITHUB_OUTPUT
          else
            echo "🔍 Code changes detected - running full tests"
            echo "docs_only=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip tests for documentation-only changes
        if: steps.changes.outputs.docs_only == 'true'
        run: |
          echo "📚 This PR contains only documentation changes"
          echo "⏭️  Skipping tests - workflow will report success"

      - name: Set up Python
        if: steps.changes.outputs.docs_only == 'false'
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        if: steps.changes.outputs.docs_only == 'false'
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Quarto
        if: steps.changes.outputs.docs_only == 'false'
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Install locales for internationalization tests
        if: steps.changes.outputs.docs_only == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen it_IT.UTF-8
          sudo locale-gen de_DE.UTF-8
          sudo locale-gen fr_FR.UTF-8
          sudo locale-gen es_ES.UTF-8
          sudo locale-gen pt_PT.UTF-8
          sudo update-locale

      - name: Install dependencies
        if: steps.changes.outputs.docs_only == 'false'
        run: uv sync --group dev

      - name: Run linter (Ruff)
        if: steps.changes.outputs.docs_only == 'false'
        run: uv run ruff check src/ tests/

      - name: Run tests
        if: steps.changes.outputs.docs_only == 'false'
        run: uv run pytest tests -v

      - name: Validate docstrings
        if: steps.changes.outputs.docs_only == 'false'
        run: uv run python scripts/validate_docstrings.py

      - name: Tests completed successfully
        run: |
          if [ "${{ steps.changes.outputs.docs_only }}" = "true" ]; then
            echo "✅ Documentation-only PR - no tests required"
          else
            echo "✅ All tests passed"
          fi
