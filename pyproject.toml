[tool.poetry]
name = "keecas"
version = "0.1.2"
description = "A set of tools for symbolic math computation done in a jupyter notebook, aimed specifically for Quarto. It is based mostly on sympy."
authors = ["kompre <s.follador@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
pint = "^0.24.3"
pipe = "^2.2"
sympy = "^1.13.1"
regex = "^2024.7.24"
ipython = "^8.26.0"
flatten-dict = "^0.4.2"
ruamel-yaml = "^0.18.6"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
ipykernel = "^6.29.5"

[tool.pdm.dev-dependencies]
dev = [
    "pytest<9.0.0,>=8.3.2",
    "ipykernel<7.0.0,>=6.29.5",
]

[project]
authors = [
    {name = "kompre", email = "s.follador@gmail.com"},
]
requires-python = "<4.0,>=3.12"
dependencies = [
    "pint<1.0.0,>=0.24.3",
    "pipe<3.0,>=2.2",
    "sympy<2.0.0,>=1.13.1",
    "regex<2025.0.0,>=2024.7.24",
    "ipython<9.0.0,>=8.26.0",
    "flatten-dict<1.0.0,>=0.4.2",
    "ruamel-yaml<1.0.0,>=0.18.6",
]
name = "keecas"
version = "0.1.2"
description = "A set of tools for symbolic math computation done in a jupyter notebook, aimed specifically for Quarto. It is based mostly on sympy."
readme = "README.md"

[dependency-groups]
dev = [
    "pytest<9.0.0,>=8.3.2",
    "ipykernel<7.0.0,>=6.29.5",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
