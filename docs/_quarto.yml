project:
  type: website

quartodoc:
  # Package to document
  package: keecas

  # Output directory for generated API docs
  dir: api-reference/_generated

  # Sidebar configuration
  sidebar: api-reference/_sidebar.yml

  # Rendering options
  renderer:
    style: markdown
    show_signature: true
    show_signature_annotations: true

  # Documentation structure - start with display.py only
  sections:
    - title: Display Module
      desc: LaTeX equation rendering and formatting
      contents:
        - name: show_eqn
        - name: check

website:
  title: "Keecas Documentation"
  description: "Symbolic and units-aware calculations for Jupyter notebooks"

  navbar:
    title: "Keecas"
    left:
      - href: index.qmd
        text: Home
      - href: getting-started/index.qmd
        text: Getting Started
      - href: user-guide/index.qmd
        text: User Guide
      - href: api-reference/index.qmd
        text: API Reference
      - href: cli-reference/index.qmd
        text: CLI Reference

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true

execute:
  freeze: auto
  echo: true  # Show code in all code blocks by default