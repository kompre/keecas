project:
  type: website

website:
  title: "Keecas Documentation"
  description: "Symbolic and units-aware calculations for Jupyter notebooks"

  sidebar:
    - contents: getting-started
      title: Getting Started
      style: docked
    - contents: cli-reference 
      title: CLI Reference
      style: docked
    - contents: examples
      title: Examples
      style: docked
    #   style: docked
    # tools:
    #   - icon: github
    #     href: https://github.com/kompre/keecas
    #   - text: 1.0.2

  navbar:
    title: "Keecas"
    left:
      - text: Getting Started
        href: getting-started/index.qmd
      - text: Examples
        href: examples/index.qmd
      - href: cli-reference/index.qmd
        text: CLI Reference
      - text: API Reference
        href: api-reference/index.qmd
    right:
      - href: "https://pypi.org/project/keecas/{{< meta version >}}/"
        text: "version {{< meta version >}}"
        icon: box-fill
      - href: https://github.com/kompre/keecas
        text: GitHub
        aria-label: GitHub
        icon: github

format:
  html:
    theme: journal
    toc: true
    code-copy: true
    include-in-header:
        # this is needed for equation numbering and labeling in HTML output             
        - text: | 
            <script>
            MathJax = { tex: { tags: 'ams' } };
            </script>
        # this get rid of unnecessary vertical scrollbars
        - text: |
            <style>
            .math.display {
              max-width: 100%;
              padding-right: 3em;
            }
            </style>

execute:
  freeze: auto
  echo: true  # Show code in all code blocks by default
  warning: false  # Suppress warnings in rendered output

filters: 
  - interlinks

interlinks:
  autolink: true
  aliases:
    keecas: [null]
  sources:
    python:
      url: https://docs.python.org/3/
    sympy:
      url: https://docs.sympy.org/latest/


quartodoc:
  # Package to document
  package: keecas
  style: pkgdown
  render_interlinks: true
  title: API Reference

  # Docstring parser
  parser: google

  # Output directory for generated API docs
  dir: api-reference

  # Sidebar configuration
  sidebar: 
    file: api-reference/_sidebar.yml
    title: API Reference
    style: docked

  # Rendering options
  renderer:
    style: markdown
    # show_signature: true
    # show_signature_annotations: false
    # table_style: description-list

  options:
    signature_name: short
    member_order: source
  
  # Documentation structure
  sections:
    - title: Display Module
      desc: LaTeX equation rendering and formatting
      contents:
        - name: display
          children: linked
        - show_eqn
        - check
        - latex_inline_dict
        - display.format_decimal_numbers
    - title: Formatters Module
      desc: Cell and row formatters for LaTeX equation rendering
      contents:
        - name: formatters
          children: linked
        - format_value
        - formatters.format_str
        - formatters.format_int
        - formatters.format_float
        - formatters.format_markdown
        - formatters.format_latex
        - formatters.format_pint
        - formatters.format_sympy
        - formatters.format_mul
        - formatters.validate_latex_kwargs
    - title: Columns Wrapper Module
      desc: Column wrappers for LaTeX equation rendering
      contents:
        - name: col_wrappers
          children: linked
        - wrap_column
        - col_wrappers.wrap_numeric
        - col_wrappers.wrap_str
        - col_wrappers.wrap_sympy
        - col_wrappers.wrap_pint
        - col_wrappers.wrap_markdown
    - title: Label Module
      desc: Label generation
      contents:
        - name: label
          children: linked
        - generate_label
        - generate_unique_label
    - title: Dataframe Module
      desc: Custom dictionary-like container for tabular equation data
      contents:
        - name: dataframe
          children: linked
        - Dataframe
        - dataframe.create_dataframe
    - title: Pipe Commands Module
      desc: Wraps common SymPy functions as decorators for functional composition
      contents:
        - name: pipe_command
    - title: Pint-SymPy Bridge
      desc: Integrates Pint unit registry with SymPy symbolic expressions by adding method `_sympy_` to `pint.Quantity` and `pint.Unit`
      contents:
        - name: pint_sympy
    - title: Config Module
      desc: Configuration management
      contents:
        - name: config
        - name: config.manager
        - name: config.migration
        - name: config.schema
    - title: Localization Module
      desc: Localization settings
      contents:
        - name: localization
        - name: localization.pint_locale
    - title: CLI Module
      desc: function of the cli interface
      contents:
        - name: cli
    - title: Utils Module
      desc: Utility functions for equation conversion and symbol name escaping
      contents:
        - name: utils
          children: linked
        # - utils.escape_name
        # - utils.escape_var
        - dict_to_eq
        - eq_to_dict

metadata-files: 
  - "api-reference/_sidebar.yml"


profile: 
  group: 
    - main
    - dev