# Keecas Local Configuration
# ===================================
## Project-specific settings for keecas symbolic math calculations
## Remove '#' to activate settings (local configs inherit from global)

[latex]
## LaTeX equation generation
# eq_prefix = "eq-"
# eq_suffix = ""
# vertical_skip = "8pt"
# default_environment = "align"
# default_label_command = "\\label"

[display]
## Display and debugging
# print_label = false
# debug = false
# katex = false
# default_mul_symbol = "\\,"

[language]
## Language settings (de, es, fr, it, pt, da, nl, no, sv, en)
# language = "en"
# disable_pint_locale = false

[units]
## Pint quantity formatting
# pint_default_format = ".2f~P"

[translations]
## Custom mathematical terms (e.g., "VERIFIED" = "VERIFICATO")
## Add custom translations here

[check_templates]
## Check function templates
# success_template = "\\textcolor{{green}}{{\\left[{symbol}{rhs}\\quad \\textbf{{{verified_text}}}\\right]}}"
# failure_template = "\\textcolor{{red}}{{\\left[{symbol}{rhs}\\quad \\textbf{{{not_verified_text}}}\\right]}}"

## Named template sets (boxed, minimal, etc.)
## Format: [check_templates.template_sets.SETNAME]
## success = "template string"
## failure = "template string"
